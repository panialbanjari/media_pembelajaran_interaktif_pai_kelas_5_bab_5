<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>PAI Kelas 5 Bab 5 - Meneladani Perjuangan Rasulullah saw.</title>
  <!-- Google Fonts: Fredoka (Display) & Nunito (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fredoka', 'sans-serif'],
            sans: ['Nunito', 'sans-serif'],
          },
          colors: {
            sand: '#FFFBEB',
            emeraldDeep: '#047857',
            emeraldMid: '#059669',
            skyDeep: '#0369A1',
            skyMid: '#0284C7',
            goldWarm: '#F59E0B',
            orangeCta: '#EA580C',
            ink: '#1E293B',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-main: #FFFBEB;
      --primary: #059669;
      --secondary: #0284C7;
      --accent: #F59E0B;
      --cta: #EA580C;
      --text-dark: #1E293B;
      --transition-speed: 0.25s;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      line-height: 1.65;
      font-size: 16px;
      overflow-x: hidden;
    }

    @media (min-width: 768px) {
      body { font-size: 18px; }
    }
    @media (min-width: 1440px) {
      body { font-size: 21px; } /* Optimal untuk Papan Interaktif / FID */
    }

    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.01em;
    }

    /* Target sentuh ramah FID & Mobile */
    .touch-target {
      min-height: 54px;
      min-width: 54px;
      transition: transform var(--transition-speed) ease, background-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
    }
    @media (min-width: 1280px) {
      .touch-target {
        min-height: 60px;
        min-width: 60px;
      }
    }

    .touch-target:active {
      transform: scale(0.97);
    }

    /* Animasi Feedback Ringan */
    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-bounce { animation: gentleBounce 0.45s ease; }
    .anim-shake { animation: gentleShake 0.35s ease; }
    .page-enter { animation: fadeSlideIn 0.3s ease forwards; }

    /* Custom Scrollbar untuk Navigasi Horizontal */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Grid Word Search */
    .word-cell {
      user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-200 selection:text-slate-900">

  <!-- TOP HEADER & STATUS BAR (Muncul di semua halaman kecuali Cover penuh, tetap bisa diakses) -->
  <header id="main-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b-2 border-emerald-200 shadow-sm hidden">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2">
      <!-- Identitas Singkat -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-display font-bold text-xl shadow-sm">
          5
        </div>
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-emerald-700">PAI Kelas 5 • Fase C</p>
          <h1 class="font-display text-base sm:text-lg font-bold text-slate-800 leading-tight">Perjuangan Rasulullah saw.</h1>
        </div>
      </div>

      <!-- Skor, Bintang & Kontrol Suara -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button onclick="toggleSpeech()" id="btn-tts" title="Bacakan Teks" class="touch-target px-3 py-2 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold text-sm flex items-center gap-1.5 border border-sky-300">
          <span id="tts-icon">🔊</span>
          <span class="hidden sm:inline" id="tts-label">Suara</span>
        </button>

        <div class="px-3.5 py-2 rounded-xl bg-amber-100 border border-amber-300 flex items-center gap-1.5 font-bold text-amber-900 text-sm sm:text-base">
          <span>⭐</span>
          <span id="global-stars">0</span>
          <span class="hidden md:inline text-xs font-semibold">Poin</span>
        </div>
      </div>
    </div>

    <!-- MENU UTAMA NAVIGASI (9 Item Wajib) -->
    <nav aria-label="Menu Utama" class="bg-emerald-700 text-white px-2 sm:px-6 py-1.5 overflow-x-auto no-scrollbar">
      <div class="max-w-7xl mx-auto flex items-center justify-start lg:justify-center gap-1.5 sm:gap-2 min-w-max" id="nav-container">
        <!-- Diisi via JS -->
      </div>
    </nav>
  </header>

  <!-- KONTEN UTAMA DINAMIS -->
  <main id="app-content" class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
    <!-- Halaman dirender di sini -->
  </main>

  <!-- FOOTER NAVIGASI KONSISTEN (Back / Next) -->
  <footer id="main-footer" class="bg-white border-t-2 border-amber-200 py-3 px-4 sm:px-6 hidden">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <button id="btn-prev" onclick="navigatePrev()" class="touch-target px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold flex items-center gap-2 border-2 border-slate-300">
        <span>⬅️</span>
        <span>Sebelumnya</span>
      </button>

      <!-- Progress Bar Keseluruhan -->
      <div class="hidden sm:flex flex-col items-center flex-1 max-w-md mx-4">
        <div class="w-full flex justify-between text-xs font-bold text-slate-600 mb-1">
          <span>Progres Belajar</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
          <div id="progress-bar-fill" class="h-full bg-emerald-500 transition-all duration-300 rounded-full" style="width: 0%"></div>
        </div>
      </div>

      <button id="btn-next" onclick="navigateNext()" class="touch-target px-5 py-3 rounded-2xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold flex items-center gap-2 shadow-md border-b-4 border-amber-700">
        <span>Selanjutnya</span>
        <span>➡️</span>
      </button>
    </div>
  </footer>

  <!-- MODAL NOTIFIKASI KUSTOM (Pengganti alert/confirm) -->
  <div id="custom-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 border-4 border-amber-400 shadow-2xl text-center page-enter">
      <div id="modal-emoji" class="text-5xl mb-3">🌟</div>
      <h3 id="modal-title" class="font-display text-2xl font-bold text-slate-800 mb-2">Judul Pesan</h3>
      <p id="modal-body" class="text-slate-700 mb-6 leading-relaxed">Isi pesan.</p>
      <div id="modal-actions" class="flex justify-center gap-3">
        <button onclick="closeModal()" class="touch-target px-6 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow">
          Mengerti!
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. STATE & DATA PEMBELAJARAN (KURIKULUM MERDEKA - PAI KELAS 5 BAB 5)
       ========================================================================== */
    const STORAGE_KEY = 'pai_kls5_bab5_aburami_v1';

    const PAGES = [
      { id: 'beranda', label: 'Beranda', icon: '🏠' },
      { id: 'materi', label: 'Materi', icon: '📖' },
      { id: 'aktivitas', label: 'Aktivitas', icon: '🎯' },
      { id: 'game', label: 'Game', icon: '🎮' },
      { id: 'latihan', label: 'Latihan', icon: '📝' },
      { id: 'kuis', label: 'Kuis', icon: '❓' },
      { id: 'hasil', label: 'Hasil', icon: '🏆' },
      { id: 'refleksi', label: 'Refleksi', icon: '💭' },
      { id: 'petunjuk', label: 'Petunjuk', icon: '📋' }
    ];

    let appState = {
      currentPage: 'beranda',
      visitedPages: ['beranda'],
      stars: 0,
      materiTab: 0, // 0: Apersepsi & Video, 1: Fathu Makkah, 2: Haji Wada, 3: Hikmah
      activityCompleted: false,
      activityPlacements: {},
      gameFoundWords: [],
      gameScore: 0,
      practiceAnswers: {},
      quizState: {
        started: false,
        finished: false,
        questions: [],
        currentIndex: 0,
        userAnswers: [],
        score: 0,
        startTime: null,
        elapsedSeconds: 0
      },
      reflection: {
        mood: '',
        liked: '',
        difficult: '',
        nextStep: '',
        submitted: false
      }
    };

    // Muat progres dari localStorage
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        }
      } catch (e) {
        console.warn('Gagal memuat penyimpanan lokal:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Gagal menyimpan progres:', e);
      }
      updateHeaderUI();
    }

    /* ==========================================================================
       2. KOMPONEN MASKOT KARAKTER SVG (ZAID & ZAHRA - FLAT DESIGN CERIA)
       ========================================================================== */
    function getMascotSVG(character = 'zaid', expression = 'happy', sizeClass = 'w-28 h-28') {
      // Ekspresi mulut & alis
      let mouth = `<path d="M42 63 Q50 72 58 63" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      let leftBrow = `<path d="M36 44 Q41 41 45 44" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
      let rightBrow = `<path d="M55 44 Q59 41 64 44" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;

      if (expression === 'think') {
        mouth = `<circle cx="52" cy="65" r="4" fill="#1E293B"/>`;
        leftBrow = `<path d="M36 45 Q41 44 45 45" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
        rightBrow = `<path d="M55 41 Q59 38 64 42" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
      } else if (expression === 'proud') {
        mouth = `<path d="M39 61 Q50 75 61 61 Z" fill="#EF4444" stroke="#1E293B" stroke-width="2.5"/>`;
      } else if (expression === 'amazed') {
        mouth = `<ellipse cx="50" cy="65" rx="5" ry="6" fill="#1E293B"/>`;
        leftBrow = `<path d="M35 41 Q41 37 46 41" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
        rightBrow = `<path d="M54 41 Q59 37 65 41" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
      }

      if (character === 'zahra') {
        return `
          <svg viewBox="0 0 100 100" class="${sizeClass} shrink-0 drop-shadow-sm" aria-label="Maskot Zahra">
            <!-- Hijab Luar -->
            <path d="M22 48 C22 20, 78 20, 78 48 L84 85 C65 92, 35 92, 16 85 Z" fill="#0284C7"/>
            <path d="M26 48 C26 25, 74 25, 74 48 L78 82 C62 88, 38 88, 22 82 Z" fill="#38BDF8"/>
            <!-- Wajah -->
            <circle cx="50" cy="52" r="21" fill="#FDE68A"/>
            <!-- Pipi Merah -->
            <circle cx="37" cy="57" r="3.5" fill="#FCA5A5" opacity="0.7"/>
            <circle cx="63" cy="57" r="3.5" fill="#FCA5A5" opacity="0.7"/>
            <!-- Mata -->
            <circle cx="41" cy="50" r="3" fill="#1E293B"/>
            <circle cx="59" cy="50" r="3" fill="#1E293B"/>
            <circle cx="42" cy="49" r="1" fill="#FFFFFF"/>
            <circle cx="60" cy="49" r="1" fill="#FFFFFF"/>
            ${leftBrow}
            ${rightBrow}
            ${mouth}
            <!-- Pin Bunga -->
            <circle cx="70" cy="42" r="5" fill="#F59E0B"/>
            <circle cx="70" cy="42" r="2" fill="#FFFBEB"/>
          </svg>
        `;
      }

      // Default: Zaid
      return `
        <svg viewBox="0 0 100 100" class="${sizeClass} shrink-0 drop-shadow-sm" aria-label="Maskot Zaid">
          <!-- Baju Koko -->
          <path d="M24 90 C24 74, 76 74, 76 90 Z" fill="#059669"/>
          <path d="M44 75 L50 86 L56 75" fill="#F59E0B"/>
          <!-- Telinga -->
          <circle cx="28" cy="53" r="5" fill="#FCD34D"/>
          <circle cx="72" cy="53" r="5" fill="#FCD34D"/>
          <!-- Wajah -->
          <circle cx="50" cy="53" r="22" fill="#FDE68A"/>
          <!-- Peci -->
          <path d="M29 40 C29 22, 71 22, 71 40 Z" fill="#1E293B"/>
          <rect x="29" y="36" width="42" height="5" rx="2" fill="#F59E0B"/>
          <!-- Pipi -->
          <circle cx="37" cy="58" r="3.5" fill="#FCA5A5" opacity="0.7"/>
          <circle cx="63" cy="58" r="3.5" fill="#FCA5A5" opacity="0.7"/>
          <!-- Mata -->
          <circle cx="41" cy="51" r="3" fill="#1E293B"/>
          <circle cx="59" cy="51" r="3" fill="#1E293B"/>
          <circle cx="42" cy="50" r="1" fill="#FFFFFF"/>
          <circle cx="60" cy="50" r="1" fill="#FFFFFF"/>
          ${leftBrow}
          ${rightBrow}
          ${mouth}
        </svg>
      `;
    }

    // Ilustrasi Edukatif Ka'bah & Tanah Suci
    function getHeroIllustrationSVG() {
      return `
        <svg viewBox="0 0 420 260" class="w-full max-w-md mx-auto drop-shadow-md rounded-3xl" role="img" aria-label="Ilustrasi Masjidil Haram dan Ka'bah">
          <!-- Langit Senja Hangat -->
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0284C7"/>
              <stop offset="65%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#FEF3C7"/>
            </linearGradient>
          </defs>
          <rect width="420" height="260" rx="24" fill="url(#skyGrad)"/>
          <!-- Bulan Sabit & Bintang -->
          <circle cx="355" cy="48" r="18" fill="#FDE68A"/>
          <circle cx="363" cy="44" r="15" fill="#0284C7"/>
          <circle cx="70" cy="45" r="3" fill="#FFFBEB"/>
          <circle cx="130" cy="32" r="2.5" fill="#FFFBEB"/>
          <circle cx="290" cy="36" r="3" fill="#FFFBEB"/>
          <!-- Awan Ceria -->
          <path d="M40 85 Q55 68 75 78 Q92 65 110 80 Q125 82 120 95 L35 95 Z" fill="#FFFFFF" opacity="0.85"/>
          <path d="M295 95 Q310 80 328 88 Q345 78 360 92 L290 95 Z" fill="#FFFFFF" opacity="0.8"/>
          <!-- Bukit Safa & Marwah / Latar Belakang -->
          <path d="M0 190 Q90 130 180 185 Q280 120 420 185 L420 260 L0 260 Z" fill="#FCD34D"/>
          <path d="M0 205 Q140 165 260 205 Q340 180 420 205 L420 260 L0 260 Z" fill="#F59E0B" opacity="0.45"/>
          <!-- Menara Masjid -->
          <rect x="82" y="85" width="16" height="105" rx="4" fill="#F8FAFC"/>
          <path d="M80 85 L90 62 L100 85 Z" fill="#059669"/>
          <circle cx="90" cy="58" r="3" fill="#F59E0B"/>

          <rect x="322" y="85" width="16" height="105" rx="4" fill="#F8FAFC"/>
          <path d="M320 85 L330 62 L340 85 Z" fill="#059669"/>
          <circle cx="330" cy="58" r="3" fill="#F59E0B"/>

          <!-- Pelataran Masjid -->
          <ellipse cx="210" cy="212" rx="145" ry="26" fill="#FFFFFF"/>
          <ellipse cx="210" cy="212" rx="135" ry="21" fill="#F1F5F9"/>

          <!-- Bangunan Ka'bah -->
          <rect x="165" y="112" width="90" height="96" rx="6" fill="#1E293B"/>
          <!-- Kiswah Emas -->
          <rect x="165" y="132" width="90" height="12" fill="#F59E0B"/>
          <line x1="173" y1="138" x2="247" y2="138" stroke="#78350F" stroke-width="2" stroke-dasharray="6 4"/>
          <!-- Pintu Ka'bah -->
          <rect x="218" y="156" width="18" height="32" rx="3" fill="#F59E0B"/>
          <!-- Hijr Ismail -->
          <path d="M136 196 Q136 176 158 176" stroke="#CBD5E1" stroke-width="6" fill="none" stroke-linecap="round"/>

          <!-- Pohon Kurma di Sisi -->
          <path d="M42 225 Q46 185 40 160" stroke="#92400E" stroke-width="6" fill="none" stroke-linecap="round"/>
          <path d="M40 160 Q20 150 12 165" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M40 160 Q60 150 68 165" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M40 160 Q25 140 18 148" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M40 160 Q55 140 62 148" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      `;
    }

    /* ==========================================================================
       3. TEXT-TO-SPEECH (NARASI AUDIO RAMAH ANAK INDONESIA)
       ========================================================================== */
    let isSpeaking = false;

    function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        showModal('🔇', 'Fitur Suara Tidak Tersedia', 'Perangkat atau browser kamu belum mendukung pembacaan suara otomatis.');
        return;
      }

      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        updateTTSButton();
        return;
      }

      const contentEl = document.getElementById('app-content');
      const textToRead = contentEl ? contentEl.innerText.replace(/\s+/g, ' ').trim().slice(0, 1200) : '';
      if (!textToRead) return;

      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'id-ID';
      utterance.rate = 0.95;
      utterance.pitch = 1.05;

      utterance.onend = () => {
        isSpeaking = false;
        updateTTSButton();
      };
      utterance.onerror = () => {
        isSpeaking = false;
        updateTTSButton();
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      updateTTSButton();
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      updateTTSButton();
    }

    function updateTTSButton() {
      const icon = document.getElementById('tts-icon');
      const label = document.getElementById('tts-label');
      if (!icon || !label) return;
      icon.textContent = isSpeaking ? '⏹️' : '🔊';
      label.textContent = isSpeaking ? 'Berhenti' : 'Bacakan';
    }

    /* ==========================================================================
       4. MODAL KUSTOM & NAVIGASI HALAMAN
       ========================================================================== */
    function showModal(emoji, title, body, customBtnHTML = null) {
      document.getElementById('modal-emoji').textContent = emoji;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      const actions = document.getElementById('modal-actions');
      if (customBtnHTML) {
        actions.innerHTML = customBtnHTML;
      } else {
        actions.innerHTML = `
          <button onclick="closeModal()" class="touch-target px-6 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow">
            Baik, Lanjutkan! 👍
          </button>
        `;
      }
      const modal = document.getElementById('custom-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function goToPage(pageId) {
      stopSpeech();
      appState.currentPage = pageId;
      if (!appState.visitedPages.includes(pageId)) {
        appState.visitedPages.push(pageId);
      }
      saveState();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigatePrev() {
      const idx = PAGES.findIndex(p => p.id === appState.currentPage);
      if (idx > 0) goToPage(PAGES[idx - 1].id);
    }

    function navigateNext() {
      const idx = PAGES.findIndex(p => p.id === appState.currentPage);
      if (idx < PAGES.length - 1) goToPage(PAGES[idx + 1].id);
    }

    function addStars(amount) {
      appState.stars += amount;
      saveState();
    }

    function updateHeaderUI() {
      const header = document.getElementById('main-header');
      const footer = document.getElementById('main-footer');
      const isCover = appState.currentPage === 'beranda';

      if (isCover) {
        header.classList.add('hidden');
        footer.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
        footer.classList.remove('hidden');
      }

      document.getElementById('global-stars').textContent = appState.stars;

      // Render Menu Navigasi
      const navContainer = document.getElementById('nav-container');
      navContainer.innerHTML = PAGES.map(p => {
        const active = p.id === appState.currentPage;
        return `
          <button onclick="goToPage('${p.id}')"
            class="touch-target px-3.5 py-2 rounded-xl font-bold text-sm sm:text-base flex items-center gap-1.5 transition-all
            ${active
              ? 'bg-amber-400 text-slate-950 shadow-md scale-105'
              : 'bg-emerald-800/70 hover:bg-emerald-600 text-white'}">
            <span>${p.icon}</span>
            <span>${p.label}</span>
          </button>
        `;
      }).join('');

      // Update Prev / Next Buttons & Progress Bar
      const idx = PAGES.findIndex(p => p.id === appState.currentPage);
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      if (btnPrev) {
        btnPrev.disabled = idx <= 0;
        btnPrev.classList.toggle('opacity-40', idx <= 0);
      }
      if (btnNext) {
        btnNext.disabled = idx >= PAGES.length - 1;
        btnNext.classList.toggle('opacity-40', idx >= PAGES.length - 1);
      }

      const pct = Math.round((appState.visitedPages.length / PAGES.length) * 100);
      const pctEl = document.getElementById('progress-percent');

    function toggleGridCell(r, c) {
      const key = `${r}-${c}`;
      const idx = selectedCells.indexOf(key);

        selectedCells.splice(idx, 1);
      } else {
        selectedCells.push(key);
      }
      checkWordMatch();
      renderPage();
    }

    function checkWordMatch() {
      // Bentuk kata dari sel terpilih (urut berdasarkan posisi)
      const sorted = [...selectedCells].sort((a, b) => {
        const [r1, c1] = a.split('-').map(Number);
        const [r2, c2] = b.split('-').map(Number);
        return r1 === r2 ? c1 - c2 : r1 - r2;
      });
      const formed = sorted.map(k => {
        const [r, c] = k.split('-').map(Number);
        return WORD_GRID[r][c];
      }).join('');

      const foundObj = TARGET_WORDS.find(t => t.word === formed && !appState.gameFoundWords.includes(t.word));
      if (foundObj) {
        appState.gameFoundWords.push(foundObj.word);
        appState.gameScore += 15;
        addStars(15);
        selectedCells = [];
        saveState();
        if (appState.gameFoundWords.length === TARGET_WORDS.length) {
          showModal('🏆', 'Penjelajah Kata Juara!', 'MasyaAllah! Kamu menemukan seluruh 8 kata kunci sejarah Fathu Makkah & Haji Wada!');
        }
      }
    }

    let quizTimerInterval = null;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startQuiz() {
      // Acak soal DAN acak urutan pilihan jawaban setiap kali mulai
      const randomizedQuestions = shuffleArray(QUIZ_BANK).map(item => ({
        ...item,
        shuffledOptions: shuffleArray(item.options)
      }));

      appState.quizState = {
        started: true,
        finished: false,
        questions: randomizedQuestions,
        currentIndex: 0,
        userAnswers: new Array(randomizedQuestions.length).fill(null),
        score: 0,
        startTime: Date.now(),
        elapsedSeconds: 0
      };
      saveState();
      startQuizTimer();
      renderPage();
    }

    function startQuizTimer() {
      if (quizTimerInterval) clearInterval(quizTimerInterval);
      quizTimerInterval = setInterval(() => {
        if (appState.currentPage === 'kuis' && appState.quizState.started && !appState.quizState.finished) {
          appState.quizState.elapsedSeconds = Math.floor((Date.now() - appState.quizState.startTime) / 1000);
          const timerEl = document.getElementById('quiz-timer-display');
          if (timerEl) {
            timerEl.textContent = formatDuration(appState.quizState.elapsedSeconds);
          }
        }
      }, 1000);
    }

    function formatDuration(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function selectQuizOption(optionText) {
      const qs = appState.quizState;
      if (qs.userAnswers[qs.currentIndex] !== null) return; // Sudah dijawab

      qs.userAnswers[qs.currentIndex] = optionText;
      const currentQ = qs.questions[qs.currentIndex];
      if (optionText === currentQ.answer) {
        qs.score += 10;
        addStars(10);
      }
      saveState();
      renderPage();
    }

    function nextQuizQuestion() {
      const qs = appState.quizState;
      if (qs.currentIndex < qs.questions.length - 1) {
        qs.currentIndex++;
        saveState();
        renderPage();
      } else {
        qs.finished = true;
        if (quizTimerInterval) clearInterval(quizTimerInterval);
        saveState();
        goToPage('hasil');
      }
    }

    }

                <button onclick="resetAllProgress()" class="touch-target px-5 py-3 rounded-2xl bg-white/20 hover:bg-white/30 text-white font-bold border border-white/40">
                  🔄 Ulangi Media
                </button>
              </div>
              <p class="text-xs text-emerald-200 pt-2">
                Media Pembelajaran Interaktif PAI Kelas 5 Bab 5 • Disusun oleh <strong>Abu Rahmi</strong> (2026)
              </p>
            </div>
          </div>
        </div>
      `;
    }

    /* --- HALAMAN 9: PETUNJUK PENGGUNAAN MEDIA --- */
    function renderPetunjuk() {
      const guides = [
        { icon: '🏠', title: 'Beranda', desc: 'Halaman sampul utama dan informasi tujuan pembelajaran Bab 5.' },
        { icon: '📖', title: 'Materi', desc: 'Berisi pertanyaan pemantik, video pembelajaran, dan ringkasan cerita Fathu Makkah, Haji Wada, serta hikmahnya.' },
        { icon: '🎯', title: 'Aktivitas', desc: 'Latihan interaktif mengelompokkan peristiwa dengan cara seret-lepas (drag & drop) atau ketuk kartu.' },
        { icon: '🎮', title: 'Game', desc: 'Permainan edukatif mencari 8 kata kunci tersembunyi di papan huruf untuk menambah poin bintang.' },
        { icon: '📝', title: 'Latihan', desc: '4 soal latihan terbimbing dengan petunjuk korektif langsung jika jawabanmu belum tepat.' },
        { icon: '❓', title: 'Kuis', desc: '10 soal evaluasi akhir yang diacak otomatis lengkap dengan penghitung waktu dan pembahasan.' },
        { icon: '🏆', title: 'Hasil', desc: 'Menampilkan skor akhir, penghargaan lencana (badge), dan rangkuman materi.' },
        { icon: '💭', title: 'Refleksi', desc: 'Ruang untuk mengungkapkan perasaanmu setelah belajar dan komitmen perilaku terpuji.' }
      ];

      return `
        <div class="max-w-4xl mx-auto space-y-6">
          <div class="bg-white rounded-3xl p-6 border-2 border-amber-300 flex flex-col sm:flex-row items-center gap-4">
            ${getMascotSVG('zaid', 'happy', 'w-20 h-20')}
            <div>
              <h2 class="font-display text-2xl sm:text-3xl font-bold text-slate-800">📋 Petunjuk Penggunaan Media</h2>
              <p class="text-slate-600">Panduan mudah untuk murid dan guru menggunakan media di layar interaktif (FID), laptop, maupun smartphone.</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${guides.map(g => `
              <div class="bg-white p-5 rounded-3xl border-2 border-slate-200 flex items-start gap-3.5 shadow-sm">
                <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-2xl flex items-center justify-center shrink-0">
                  ${g.icon}
                </div>
                <div>
                  <h3 class="font-display text-xl font-bold text-slate-800">${g.title}</h3>
                  <p class="text-slate-600 text-sm sm:text-base mt-0.5">${g.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="bg-sky-50 border-2 border-sky-200 rounded-3xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="text-sky-950 font-semibold text-sm sm:text-base">
              🔊 <strong>Fitur Narasi Suara:</strong> Tekan tombol <strong>"Bacakan"</strong> di pojok kanan atas kapan saja untuk mendengarkan teks materi dibacakan!
            </p>
            <button onclick="goToPage('materi')" class="touch-target px-6 py-3 rounded-2xl bg-amber-400 text-slate-950 font-bold shadow shrink-0">
              Mulai Belajar ➡️
            </button>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       6. INISIALISASI APLIKASI
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderPage();
      if (appState.quizState.started && !appState.quizState.finished) {
        startQuizTimer();
      }
    });
  </script>
